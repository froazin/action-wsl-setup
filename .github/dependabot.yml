---
version: 2
updates:
  # A 7-day cooldown, like min-release-age in .npmrc, gives a compromised
  # release time to be caught before Dependabot proposes it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
