---
version: 2
updates:
  # A 7-day cooldown, like min-release-age in .npmrc, gives a compromised
  # release time to be caught before Dependabot proposes it.
  # PRs open at 01:00 UTC and merge once CI passes, before the nightly
  # release at 05:00 UTC. The prefix gives a "chore(deps):" header,
  # with a scope from CLAUDE.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "01:00"
      timezone: "Etc/UTC"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    ignore:
      # ncc 0.45 can't build with TypeScript 7. See CLAUDE.md.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The action runs on Node.js 24, so its types stay on 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  # Wednesday, apart from npm's Monday PR, so each is tested on a main that
  # already has the other.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "wednesday"
      time: "01:00"
      timezone: "Etc/UTC"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
