---
version: 2
updates:
  # A 7-day cooldown, like min-release-age in .npmrc, gives a compromised
  # release time to be caught before Dependabot proposes it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    ignore:
      # ncc 0.45 can't build with TypeScript 7. See CLAUDE.md.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The action runs on Node.js 24, so its types stay on 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
